# cyberdeck.conf — the deck's ONE managed Apache conf (installed to
# /etc/apache2/conf-available/cyberdeck.conf and enabled via a2enconf by
# setup.sh; the conf-enabled symlink is bookkeeping, not content).
#
# Design (plan 2026-09-19-23-23-36 §2, extended by 2026-09-20-10-47-32):
#  - the default DocumentRoot /var/www/html is KEPT (the repo's api/www/
#    contents deploy there — index.html is the dashboard page root, vnc/
#    is the vendored noVNC client);
#  - /api/ is proxied to the loopback-only Go API, so the browser talks to
#    one origin (no CORS) and the API never binds a non-loopback interface;
#  - /shell/ is proxied to ShellInABox (loopback :4200) — browser SSH;
#    /vnc/websockify is proxied over WebSocket to websockify (loopback
#    :6080) via mod_proxy_wstunnel — browser VNC, with the RFB dial staying
#    on loopback behind it.
# No other virtual-host behavior changes.
<IfModule mod_proxy.c>
  # Preserve the /api/ prefix: the Go mux registers its data routes under
  # /api/ (e.g. /api/metrics), so the target must keep that prefix — mapping
  # to the bare root would strip it and the API would answer 404.
  ProxyPass /api/ http://127.0.0.1:8080/api/
  ProxyPassReverse /api/ http://127.0.0.1:8080/api/

  # /shell/ -> ShellInABox, trailing-slash mapped: the daemon serves its PAM
  # login page and XHR endpoints at /, so /shell/foo becomes /foo. The
  # plain HTTP proxy is sufficient — siab 2.21's terminal transport is
  # XHR-POST, not a WebSocket.
  ProxyPass /shell/ http://127.0.0.1:4200/
  ProxyPassReverse /shell/ http://127.0.0.1:4200/
</IfModule>

<IfModule mod_proxy_wstunnel.c>
  # /vnc/websockify -> the noVNC WebSocket tunnel. The vendored client
  # (served from under /vnc/) opens its WS at the page-relative path
  # 'websockify' — page /vnc/vnc.html => /vnc/websockify. websockify
  # (0.0.0.0:6080) then dials x11vnc on loopback :5900, so the RFB stream
  # never leaves the host.
  ProxyPass /vnc/websockify ws://127.0.0.1:6080/websockify
  ProxyPassReverse /vnc/websockify ws://127.0.0.1:6080/websockify
</IfModule>